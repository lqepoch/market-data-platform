[package]
name = "market-data-platform"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.0"
license = "MIT"
publish = false

[dependencies]
arrow-array = "=60.0.0"
arrow-schema = "=60.0.0"
axum = { version = "=0.8.9", features = ["json"] }
chrono = { version = "=0.4.45", features = ["serde"] }
clap = { version = "=4.5.53", features = ["derive"] }
fs2 = "=0.4.3"
jsonwebtoken = { version = "=10.3.0", default-features = false, features = ["aws_lc_rs"] }
hex = "=0.4.3"
market-contracts = { git = "https://github.com/lqepoch/trading-core", rev = "f793be47ab90ebff9f530c8b08f41db5e774e4e5", package = "market-contracts" }
exact-decimal = { git = "https://github.com/lqepoch/trading-core", rev = "f793be47ab90ebff9f530c8b08f41db5e774e4e5", package = "exact-decimal" }
broker-ports = { git = "https://github.com/lqepoch/broker-connectors", rev = "99e1d36f864d1e89e8cfba95651d29920e2f4c5a", package = "broker-ports" }
alpaca-stream = { git = "https://github.com/lqepoch/broker-connectors", rev = "99e1d36f864d1e89e8cfba95651d29920e2f4c5a", package = "alpaca-stream" }
parquet = { version = "=60.0.0", default-features = false, features = ["arrow", "zstd"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["arbitrary_precision"] }
sha2 = "=0.10.9"
thiserror = "=2.0.21"
tokio = { version = "=1.53.2", features = ["full"] }
zeroize = "=1.9.1"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.20", features = ["env-filter"] }

alpaca-rest-read = { git = "https://github.com/lqepoch/broker-connectors", rev = "99e1d36f864d1e89e8cfba95651d29920e2f4c5a", package = "alpaca-rest-read" }
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "stream"] }

[features]
benchmark-snappy = ["parquet/snap"]
offline-capture-synthetic = ["alpaca-stream/offline-test-support"]

[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.5", default-features = false, features = ["fs", "process", "std"] }

[dev-dependencies]
tempfile = "=3.23.0"
tower = { version = "=0.5.3", features = ["util"] }
