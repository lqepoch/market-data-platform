[package]
name = "market-data-platform"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "MIT"
publish = false

[dependencies]
arrow-array = "=60.0.0"
arrow-schema = "=60.0.0"
axum = { version = "=0.8.9", features = ["json"] }
chrono = { version = "=0.4.45", features = ["serde"] }
clap = { version = "=4.5.53", features = ["derive"] }
fs2 = "=0.4.3"
jsonwebtoken = { version = "=10.3.0", default-features = false, features = ["aws_lc_rs"] }
hex = "=0.4.3"
market-contracts = { git = "https://github.com/lqepoch/trading-core", rev = "22315511e084050c2ec037fa36c5d07a0bc6606e", package = "market-contracts" }
exact-decimal = { git = "https://github.com/lqepoch/trading-core", rev = "22315511e084050c2ec037fa36c5d07a0bc6606e", package = "exact-decimal" }
broker-ports = { git = "https://github.com/lqepoch/broker-connectors", rev = "a6a864701f39f25b6b1d757cbd8a5bb918678b99", package = "broker-ports" }
alpaca-stream = { git = "https://github.com/lqepoch/broker-connectors", rev = "a6a864701f39f25b6b1d757cbd8a5bb918678b99", package = "alpaca-stream" }
parquet = { version = "=60.0.0", default-features = false, features = ["arrow", "zstd"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["arbitrary_precision"] }
sha2 = "=0.10.9"
thiserror = "=2.0.21"
tokio = { version = "=1.53.1", features = ["full"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.20", features = ["env-filter"] }

[features]
benchmark-snappy = ["parquet/snap"]
offline-capture-synthetic = ["alpaca-stream/offline-test-support"]

[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.5", default-features = false, features = ["fs", "process", "std"] }

[dev-dependencies]
tempfile = "=3.23.0"
tower = { version = "=0.5.3", features = ["util"] }
