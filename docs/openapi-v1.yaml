openapi: 3.1.0
info:
  title: LQEpoch Market Data Platform Read API
  version: 1.0.0
  description: >-
    Read-only authenticated access to verified MDP datasets. Dataset bars use the existing
    lqepoch.us_equity_trade_bar_1m.v1 contract. The separate /v1/market/bars route uses
    the pinned trading-core Bars V1 query contract with exact decimal strings, source segments,
    gaps and stable bounded pagination. They do not carry DatasetManifestV2
    completion evidence. A future BarV2 response must use a separately versioned contract. The
    optional Linux LocalTest Pair route verifies one exact existing chunk and does not establish a
    capture rollup or provider completeness. It is mounted only when explicit LocalTest state and
    staging roots are configured at startup. The
    router adds Cache-Control: no-store to every response, including authorization, extractor,
    fallback, and overload errors; an existing Cache-Control value is preserved.
servers:
  - url: http://127.0.0.1:8088
    description: Default loopback-only listener
paths:
  /healthz:
    get:
      operationId: liveness
      summary: Process liveness
      responses:
        "200":
          description: The HTTP process is serving requests.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    const: alive
  /readyz:
    get:
      operationId: readiness
      summary: Identity and transport configuration status
      responses:
        "200":
          description: Required independent MDP verifier keys are configured.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
        "503":
          description: The service is restricted to liveness because MDP keys are not configured.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
  /v1/datasets/{dataset_id}/bars:
    get:
      operationId: getDatasetBarsV1
      summary: Read verified one-minute trade bars
      description: >-
        The JWT is checked before any request-level storage access or query. LocalTest transport
        serves only the diagnostic namespace and always reports synthetic/synthetic/unknown
        provenance. Curated reads require an independently authorized archive. Remote publication
        is currently disabled pending a trusted source-admission issuer/verifier. No capture, upload,
        account, or order operation is exposed by this bars route. A separate optional LocalTest
        chunk-verification route does not publish or ingest data.
      security:
        - mdpDelegation: []
      parameters:
        - name: dataset_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
        - name: namespace
          in: query
          required: true
          schema:
            type: string
            enum: [diagnostic, curated]
        - name: symbol
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 16
            pattern: "^[A-Z0-9.-]+$"
      responses:
        "200":
          description: Verified V1 bars and the existing remote query summary.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BarsResponseV1"
        "400":
          description: Invalid symbol, dataset identifier, or query parameters.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid market:read delegation.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Requested namespace is not authorized for the configured transport.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: The bounded result limit was exceeded.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "504":
          description: Query deadline expired; in-flight worker cancellation is supervised.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: No authenticated service or verified query result is available.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v2/local-test/capture-pairs/{receipt_sha256}/verify:
    get:
      operationId: verifyOneLocalTestCapturePairChunkV2
      summary: Verify one explicitly named LocalTest Pair chunk
      description: >-
        This Linux-only route is mounted only when the service starts with an existing LocalTest
        root plus explicit Pair state and staging roots. Authentication is checked before the
        receipt or archive is accessed. The canonical receipt basename is constructed from the
        lowercase SHA-256 path value; request paths and receipt directory scans are never accepted.
        The bounded worker verifies exactly one receipt, both manifests and objects, and the Core
        raw/event join. The compact response contains no rows, raw payloads, or local paths. It
        preserves one validated provider/feed pair (alpaca/opra or synthetic/synthetic) and always reports
        source_completeness NOT_ASSERTED. A verified chunk is not a complete capture, provider
        entitlement, freshness, Drive durability, or historical batch.
      security:
        - mdpDelegation: []
      parameters:
        - name: receipt_sha256
          in: path
          required: true
          description: Lowercase hexadecimal SHA-256 of one existing canonical chunk receipt.
          schema:
            type: string
            minLength: 64
            maxLength: 64
            pattern: "^[0-9a-f]{64}$"
      responses:
        "200":
          description: Exact readback verification of one local chunk only.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocalCapturePairChunkSummaryV2"
        "400":
          description: Receipt hash is not canonical lowercase SHA-256.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid market:read delegation.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Pair verification is not authorized for the configured transport.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: Receipt or artifacts exceed the bounded verifier limits.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Pair verification failed, storage lock is busy, or the service is at capacity.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "504":
          description: Request deadline expired and owned worker cancellation is supervised.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/market/bars:
    get:
      operationId: getMarketBarsV1
      summary: Read bounded source-preserving market bars
      description: >-
        Requires the opt-in runtime and a pinned calendar. The interval is [start,end) in UTC.
        Research mode requires the verified research channel. Unknown feed, entitlement and
        adjustment evidence cannot be promoted. Downgrade requires explicit caller permission.
        Futu history attempts require an explicitly configured server-side Gateway port and are
        provisional, historical-only, and limited to NEW/BUFFER slices; provider_mode cannot widen
        this policy. A multi-day futu_only request can have a same-phase OLD slice suppress otherwise
        eligible NEW/BUFFER slices of that phase; partial results are not promised, while auto routing
        is unaffected. These attempts do not imply realtime access or trusted cache promotion.
        A failed provider run preserves its classified gap and unknown source facts. If an older
        planned run remains, the partial empty page carries truncated=true and its signed
        continuation; the final failed run has none. This does not replace the failed source.
        All fields are required except cursor; unknown and duplicate parameters are rejected.
      security: [{mdpDelegation: []}]
      parameters:
        - name: symbol
          in: query
          required: true
          schema:
            $ref: "https://raw.githubusercontent.com/lqepoch/trading-core/f793be47ab90ebff9f530c8b08f41db5e774e4e5/schemas/openapi.json#/components/schemas/BarsRequestV1/properties/symbol"
        - name: asset_class
          in: query
          required: true
          schema:
            $ref: "https://raw.githubusercontent.com/lqepoch/trading-core/f793be47ab90ebff9f530c8b08f41db5e774e4e5/schemas/openapi.json#/components/schemas/BarsRequestV1/properties/asset_class"
        - name: start
          in: query
          required: true
          schema:
            $ref: "https://raw.githubusercontent.com/lqepoch/trading-core/f793be47ab90ebff9f530c8b08f41db5e774e4e5/schemas/openapi.json#/components/schemas/BarsRequestV1/properties/start"
        - name: end
          in: query
          required: true
          schema:
            $ref: "https://raw.githubusercontent.com/lqepoch/trading-core/f793be47ab90ebff9f530c8b08f41db5e774e4e5/schemas/openapi.json#/components/schemas/BarsRequestV1/properties/end"
        - name: resolution
          in: query
          required: true
          schema:
            $ref: "https://raw.githubusercontent.com/lqepoch/trading-core/f793be47ab90ebff9f530c8b08f41db5e774e4e5/schemas/openapi.json#/components/schemas/BarsRequestV1/properties/resolution"
        - name: session_scope
          in: query
          required: true
          schema:
            $ref: "https://raw.githubusercontent.com/lqepoch/trading-core/f793be47ab90ebff9f530c8b08f41db5e774e4e5/schemas/openapi.json#/components/schemas/BarsRequestV1/properties/session_scope"
        - name: adjustment
          in: query
          required: true
          schema:
            $ref: "https://raw.githubusercontent.com/lqepoch/trading-core/f793be47ab90ebff9f530c8b08f41db5e774e4e5/schemas/openapi.json#/components/schemas/BarsRequestV1/properties/adjustment"
        - name: provider_mode
          in: query
          required: true
          schema:
            $ref: "https://raw.githubusercontent.com/lqepoch/trading-core/f793be47ab90ebff9f530c8b08f41db5e774e4e5/schemas/openapi.json#/components/schemas/BarsRequestV1/properties/provider_mode"
        - name: allow_daily_downgrade
          in: query
          required: true
          schema:
            $ref: "https://raw.githubusercontent.com/lqepoch/trading-core/f793be47ab90ebff9f530c8b08f41db5e774e4e5/schemas/openapi.json#/components/schemas/BarsRequestV1/properties/allow_daily_downgrade"
        - name: limit
          in: query
          required: true
          schema:
            $ref: "https://raw.githubusercontent.com/lqepoch/trading-core/f793be47ab90ebff9f530c8b08f41db5e774e4e5/schemas/openapi.json#/components/schemas/BarsRequestV1/properties/limit"
        - name: cursor
          in: query
          required: false
          schema:
            $ref: "https://raw.githubusercontent.com/lqepoch/trading-core/f793be47ab90ebff9f530c8b08f41db5e774e4e5/schemas/openapi.json#/components/schemas/BarsRequestV1/properties/cursor"
      responses:
        "200":
          description: Complete or empty bounded response; this does not establish trusted provider authority.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "https://raw.githubusercontent.com/lqepoch/trading-core/f793be47ab90ebff9f530c8b08f41db5e774e4e5/schemas/openapi.json#/components/schemas/BarsResponseV1"
        "206":
          description: Partial or unknown coverage, including continuation and classified gaps.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "https://raw.githubusercontent.com/lqepoch/trading-core/f793be47ab90ebff9f530c8b08f41db5e774e4e5/schemas/openapi.json#/components/schemas/BarsResponseV1"
        "400":
          description: Invalid, duplicated or unknown query parameter.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
        "401":
          description: Invalid market delegation or upstream authentication failure.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
        "403":
          description: Unauthorized channel or provider access denied.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
        "410":
          description: Continuation cursor expired; restart the fixed request.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
        "413":
          description: Bounded response limit exceeded.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
        "422":
          description: Unsupported resolution, adjustment or provider capability.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
        "429":
          description: Provider request quota exceeded.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
        "502":
          description: Provider response rejected.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
        "503":
          description: Disabled runtime, missing calendar or unavailable provider/cache.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
        "504":
          description: Supervised query or provider deadline expired.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
  /v1/research/yfinance/daily:
    get:
      operationId: getYahooDailyResearchObservationsV1
      summary: Read provider-native Yahoo daily observations for research display
      description: >-
        This independent endpoint is disabled by default and requires a verified research
        market:read principal. It returns the validated Stock bridge payload without projecting
        it to Core Bars V1 or asserting raw prices, complete calendar coverage, point-in-time
        availability, canonical status, or execution authority. Adjustment is a request preference;
        Yahoo semantics remain unknown/provider-native. Requests use UTC [start,end), support
        1970 through at most 100 years and eight unique symbols, and page newest-first in contiguous
        windows of at most 3650 days. Repeat the original query and pass next_cursor unchanged to
        continue toward older history. A 200 response can be partial; inspect the embedded bridge
        missing_symbols and coverage.gaps. A wholly empty page is an error, not proof of a closed
        market. This route does not use market-bars cache/archive authority.
      security: [{mdpDelegation: []}]
      parameters:
        - name: symbols
          in: query
          required: true
          description: Comma-separated 1–8 unique uppercase stock/ETF symbols; OCC option symbols are rejected.
          schema: {type: string, minLength: 1, maxLength: 263}
        - name: asset_class
          in: query
          required: true
          schema: {type: string, enum: [stock, etf]}
        - name: start_utc
          in: query
          required: true
          description: UTC RFC 3339 instant, inclusive; no earlier than 1970-01-01T00:00:00Z.
          schema: {type: string, format: date-time, pattern: "Z$"}
        - name: end_utc
          in: query
          required: true
          description: UTC RFC 3339 instant, exclusive; at most one day beyond request time.
          schema: {type: string, format: date-time, pattern: "Z$"}
        - name: adjustment
          in: query
          required: false
          description: Provider request preference only; neither option confirms raw/as-traded prices.
          schema: {type: string, enum: [unadjusted, adjusted], default: unadjusted}
        - name: cursor
          in: query
          required: false
          description: Opaque 30-minute HMAC continuation bound to the full query and verified principal.
          schema: {type: string, maxLength: 8192}
      responses:
        "200":
          description: One nonempty provider-native daily page; partial symbol coverage remains explicit in payload.
          headers: {Cache-Control: {$ref: "#/components/headers/NoStore"}}
          content:
            application/json: {schema: {$ref: "#/components/schemas/YFinanceResearchObservationsV1"}}
        "400":
          description: Malformed query, unknown parameter, invalid cursor, or query/cursor binding mismatch.
          headers: {Cache-Control: {$ref: "#/components/headers/NoStore"}}
          content:
            application/json: {schema: {$ref: "#/components/schemas/YFinanceResearchError"}}
        "401":
          description: Missing/invalid MDP delegation or bridge service credential rejection.
          headers: {Cache-Control: {$ref: "#/components/headers/NoStore"}}
          content:
            application/json: {schema: {$ref: "#/components/schemas/YFinanceResearchError"}}
        "403":
          description: The verified principal is not on the research channel, or the bridge denies access.
          headers: {Cache-Control: {$ref: "#/components/headers/NoStore"}}
          content:
            application/json: {schema: {$ref: "#/components/schemas/YFinanceResearchError"}}
        "410":
          description: The signed continuation expired; restart from the newest page.
          headers: {Cache-Control: {$ref: "#/components/headers/NoStore"}}
          content:
            application/json: {schema: {$ref: "#/components/schemas/YFinanceResearchError"}}
        "413":
          description: Query, cursor, upstream payload, or serialized response exceeded its bound.
          headers: {Cache-Control: {$ref: "#/components/headers/NoStore"}}
          content:
            application/json: {schema: {$ref: "#/components/schemas/YFinanceResearchError"}}
        "422":
          description: Unsupported symbol, asset class, date range, or adjustment request.
          headers: {Cache-Control: {$ref: "#/components/headers/NoStore"}}
          content:
            application/json: {schema: {$ref: "#/components/schemas/YFinanceResearchError"}}
        "429":
          description: The Yahoo bridge rate-limited the bounded provider request.
          headers: {Cache-Control: {$ref: "#/components/headers/NoStore"}}
          content:
            application/json: {schema: {$ref: "#/components/schemas/YFinanceResearchError"}}
        "502":
          description: Malformed provider response or an all-empty provider page.
          headers: {Cache-Control: {$ref: "#/components/headers/NoStore"}}
          content:
            application/json: {schema: {$ref: "#/components/schemas/YFinanceResearchError"}}
        "503":
          description: The independent API or Yahoo bridge is disabled or unavailable.
          headers: {Cache-Control: {$ref: "#/components/headers/NoStore"}}
          content:
            application/json: {schema: {$ref: "#/components/schemas/YFinanceResearchError"}}
        "504":
          description: The bounded Yahoo provider request exceeded its deadline.
          headers: {Cache-Control: {$ref: "#/components/headers/NoStore"}}
          content:
            application/json: {schema: {$ref: "#/components/schemas/YFinanceResearchError"}}
  /v1/market/sessions:
    get:
      operationId: getMarketSessionInstancesV1
      summary: Read cash calendar instances or a trusted instrument-scoped overnight overlay
      security: [{mdpDelegation: []}]
      parameters:
        - name: start
          in: query
          required: true
          schema: {type: string, format: date-time}
          description: UTC timestamp ending in Z; half-open range bounded to 366 days.
        - name: end
          in: query
          required: true
          schema: {type: string, format: date-time}
          description: UTC timestamp ending in Z; half-open range bounded to 366 days.
        - name: symbol
          in: query
          required: false
          schema: {type: string, maxLength: 32}
          description: Optional instrument selector; must be supplied with asset_class.
        - name: asset_class
          in: query
          required: false
          schema:
            type: string
            enum: [stock, etf]
          description: Optional instrument selector; must be supplied with symbol.
      responses:
        "200":
          description: >-
            Original calendar days and instances with stable version, public cash/overlay component
            identities, overlay-selection status, and calendar-compatible overnight routes. Omitting
            both instrument parameters selects cash only. Calendar routes do not grant provider
            entitlement or prove data availability.
        "400":
          description: >-
            Invalid or excessive window, unsupported instrument selector, or incomplete
            symbol/asset_class pair.
        "401":
          description: Missing or invalid market delegation.
        "503":
          description: Pinned calendar absent or requested range not covered.
  /v1/providers/capabilities:
    get:
      summary: Discover provider ownership without asserting entitlement or coverage
      description: >-
        The runtime's `futu_historical_attemptable` flag reflects only explicit server-side
        loopback history-adapter configuration. It is separate from generic planner capabilities
        and does not prove reachability, provider permission, entitlement, actual feed, realtime
        access, or historical coverage. Verification remains blocked until independent evidence
        is supplied.
      security: [{mdpDelegation: []}]
      responses:
        '200':
          description: Registration with explicit unknown entitlement and pending runtime status
        '401':
          description: Missing or invalid market delegation
  /v1/market/cache/status:
    get:
      summary: Discover cache availability and the authenticated principal's volatile invalidation events
      description: >-
        The event list is bounded to 128 process-local summaries for the verified principal and
        operator cache profile. Events disappear on restart and report cache-pointer
        invalidation/readback only; they do not assert market-data coverage, completeness,
        freshness, or entitlement. The response omits profile hashes, cache fingerprints, rows,
        and credentials.
      security: [{mdpDelegation: []}]
      responses:
        '200':
          description: Unified cache status and principal-scoped invalidation events, separate from the archive cache
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketCacheStatus"
        '401':
          description: Missing or invalid market delegation
  /v1/market/quotes:
    get:
      summary: Reserved read-only quotes contract
      security: [{mdpDelegation: []}]
      responses:
        '501':
          description: UNSUPPORTED_PROVIDER_CAPABILITY; no market rows are fabricated
        '401':
          description: Missing or invalid market delegation
  /v1/market/trades:
    get:
      summary: Reserved read-only trades contract
      security: [{mdpDelegation: []}]
      responses:
        '501':
          description: UNSUPPORTED_PROVIDER_CAPABILITY; no market rows are fabricated
        '401':
          description: Missing or invalid market delegation
  /v1/news:
    get:
      summary: Reserved independent news read contract
      security: [{mdpDelegation: []}]
      responses:
        '501':
          description: UNSUPPORTED_PROVIDER_CAPABILITY; EqoBoard RSS adapters are not yet proxied. NewsItemV1 is a reserved contract, not a populated response.
        '401':
          description: Missing or invalid market delegation
components:
  headers:
    NoStore:
      description: Response is not cacheable by HTTP caches.
      schema:
        type: string
        const: no-store
  securitySchemes:
    mdpDelegation:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        HS256 only; audience lqepoch-market-data; exact scope [market:read]; maximum lifetime
        60 seconds; issuer and key are selected by kid: mdp-terminal maps to
        eqoboard-openterminal and MDP_TERMINAL_JWT_SECRET, while mdp-research maps to
        openterminal-research and MDP_RESEARCH_JWT_SECRET. These keys are distinct from each
        other and from Gateway keys. Each BFF signer receives only its matching MDP key; the MDP
        verifier receives both.
  schemas:
    MarketCacheStatus:
      type: object
      additionalProperties: false
      required:
        - schema_version
        - cache_status
        - canonical_market_cache_configured
        - runtime
        - coverage_asserted
        - note
        - invalidation_events_status
        - invalidation_events
        - volatile
        - restart_lost
      properties:
        schema_version: {type: string, const: market-cache-status-v1}
        cache_status: {type: string, enum: [not_inspected, unavailable]}
        canonical_market_cache_configured: {type: boolean}
        runtime:
          type: [object, "null"]
          additionalProperties: true
        note: {type: string}
        invalidation_events_status: {type: string, enum: [available, unavailable]}
        invalidation_events:
          type: array
          maxItems: 128
          items:
            $ref: "#/components/schemas/MarketCacheInvalidationEvent"
        volatile: {type: boolean, const: true}
        restart_lost: {type: boolean, const: true}
        coverage_asserted: {type: boolean, const: false}
    MarketCacheInvalidationEvent:
      type: object
      additionalProperties: false
      required:
        - session_instance_id
        - logical_generation
        - logical_updated_at_unix_seconds
        - reread_status
        - current_provider
        - current_feed
        - current_authority
      properties:
        session_instance_id: {type: [string, "null"]}
        logical_generation: {$ref: "#/components/schemas/NullableWireU64"}
        logical_updated_at_unix_seconds: {$ref: "#/components/schemas/NullableWireU64"}
        reread_status: {type: string, enum: [reread_verified, reread_unavailable]}
        current_provider: {type: [string, "null"]}
        current_feed: {type: [string, "null"]}
        current_authority: {type: [string, "null"], enum: [authoritative, provisional, null]}
    NewsItemV1:
      description: >-
        Reserved independent read-only news contract. The current /v1/news endpoint returns 501.
        Publication and retrieval clocks describe news and never substitute for market event time.
        Source ownership, content license and summary permissions require separate admission.
      type: object
      additionalProperties: false
      required: [title, source, url, published_at, fetched_at, symbols, language, revision_id, dedup_id]
      properties:
        title: {type: string, maxLength: 2048}
        source: {type: string, maxLength: 256}
        url: {type: string, format: uri, maxLength: 4096}
        published_at: {type: string, format: date-time}
        fetched_at: {type: string, format: date-time}
        symbols:
          type: array
          maxItems: 100
          items: {type: string, maxLength: 32}
        language: {type: string, maxLength: 32}
        summary: {type: string, maxLength: 8192}
        revision_id: {type: string, maxLength: 256}
        dedup_id: {type: string, maxLength: 256}
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
          enum:
            - invalid_request
            - unauthorized
            - not_authorized
            - result_limit_exceeded
            - query_timeout
            - query_unavailable
    Readiness:
      type: object
      required: [status, market_ready, source_entitlement]
      properties:
        status:
          type: string
          enum: [ready, not_ready]
        market_ready:
          const: false
          description: Remains false until trusted source and entitlement evidence is integrated.
        source_entitlement:
          const: unverified
    BarsResponseV1:
      type: object
      required: [summary, rows]
      properties:
        summary:
          $ref: "#/components/schemas/RemoteQuerySummary"
        rows:
          type: array
          maxItems: 390
          items:
            $ref: "#/components/schemas/TradeMinuteBarV1"
    YFinanceResearchObservationsV1:
      type: object
      additionalProperties: false
      required: [schema_version, provider, source, asset_class, resolution, requested_adjustment, provider_adjustment_semantics, adjustment_confirmed_raw, numeric_encoding, canonical, point_in_time, executable, display_only, mdp_coverage_asserted, requested_symbols, requested_range, page_range, observation, next_cursor]
      properties:
        schema_version: {type: string, const: mdp-yfinance-research-observations-v1}
        provider: {type: string, const: yfinance}
        source: {type: string, const: Yahoo Finance}
        asset_class: {type: string, enum: [stock, etf]}
        resolution: {type: string, const: 1d}
        requested_adjustment: {type: string, enum: [unadjusted, adjusted]}
        provider_adjustment_semantics: {type: string, const: unknown_or_provider_native}
        adjustment_confirmed_raw: {type: boolean, const: false}
        numeric_encoding: {type: string, const: binary_float_projection}
        canonical: {type: boolean, const: false}
        point_in_time: {type: boolean, const: false}
        executable: {type: boolean, const: false}
        display_only: {type: boolean, const: true}
        mdp_coverage_asserted: {type: boolean, const: false}
        requested_symbols:
          type: array
          minItems: 1
          maxItems: 8
          uniqueItems: true
          items: {type: string, pattern: "^[A-Z0-9][A-Z0-9.-]{0,31}$"}
        requested_range: {$ref: "#/components/schemas/YFinanceResearchRange"}
        page_range: {$ref: "#/components/schemas/YFinanceResearchRange"}
        observation: {$ref: "#/components/schemas/YFinanceResearchObservation"}
        next_cursor: {type: [string, "null"], maxLength: 8192}
    YFinanceResearchRange:
      type: object
      additionalProperties: false
      required: [start_utc, end_utc, semantics]
      properties:
        start_utc: {type: string, format: date-time, pattern: "Z$"}
        end_utc: {type: string, format: date-time, pattern: "Z$"}
        semantics: {type: string, const: start_inclusive_end_exclusive}
    YFinanceResearchObservation:
      type: object
      additionalProperties: false
      required: [source_observation_sha256, fetched_at_utc, payload]
      properties:
        source_observation_sha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: SHA-256 of the exact HTTP response body received from the local Stock bridge.
        fetched_at_utc: {type: string, format: date-time}
        payload:
          type: object
          description: Validated yfinance-history-bridge-v1 JSON preserved without Bars V1 projection.
          additionalProperties: false
          required: [schema_version, status, provider, source, asset_class, classification_source, resolution, effective_resolution, adjustment, provider_adjustment_semantics, adjustment_confirmed_raw, provider_repair_enabled, numeric_encoding, volume_encoding, canonical, point_in_time, executable, display_only, requested_range, requested_symbols, returned_symbols, missing_symbols, available_at, fetched_at, source_observed_at, request_started_at, cache_status, freshness, coverage, action_coverage, actions, bars, provenance]
          properties:
            schema_version: {type: string, const: yfinance-history-bridge-v1}
            status: {type: string, enum: [ready, partial]}
            provider: {type: string, const: yfinance}
            source: {type: string, const: Yahoo Finance}
            asset_class: {type: string, enum: [stock, etf]}
            classification_source: {type: string, const: caller_declared}
            resolution: {type: string, const: 1d}
            effective_resolution: {type: string, const: 1d}
            adjustment: {type: string, enum: [unadjusted, adjusted]}
            provider_adjustment_semantics: {type: string, const: unknown_or_provider_native}
            adjustment_confirmed_raw: {type: boolean, const: false}
            provider_repair_enabled: {type: boolean, const: false}
            numeric_encoding: {type: string, const: binary_float_projection}
            volume_encoding: {type: string, const: integer_exact_or_safe_integer_float}
            canonical: {type: boolean, const: false}
            point_in_time: {type: boolean, const: false}
            executable: {type: boolean, const: false}
            display_only: {type: boolean, const: true}
            requested_range:
              type: object
              additionalProperties: false
              required: [start, end, semantics]
              properties:
                start: {type: string, format: date-time}
                end: {type: string, format: date-time}
                semantics: {type: string, const: start_inclusive_end_exclusive}
            requested_symbols: {type: array, minItems: 1, maxItems: 8, uniqueItems: true, items: {type: string}}
            returned_symbols: {type: array, items: {type: string}, uniqueItems: true}
            missing_symbols: {type: array, items: {type: string}, uniqueItems: true}
            available_at: {type: string, format: date-time}
            fetched_at: {type: string, format: date-time}
            source_observed_at: {type: string, format: date-time}
            request_started_at: {type: string, format: date-time}
            cache_status: {type: string, enum: [network, fresh_cache, stale_cache]}
            freshness: {type: string, enum: [retrieved, stale]}
            coverage:
              type: object
              additionalProperties: false
              required: [requested_start, requested_end, bar_count, per_symbol, gaps, calendar_gaps_assessed]
              properties:
                requested_start: {type: string, format: date-time}
                requested_end: {type: string, format: date-time}
                bar_count: {type: integer, minimum: 0, maximum: 24000}
                per_symbol:
                  type: array
                  minItems: 1
                  maxItems: 8
                  items:
                    type: object
                    additionalProperties: false
                    required: [symbol, bar_count, first_bar_at, last_bar_at, gaps]
                    properties:
                      symbol: {type: string}
                      bar_count: {type: integer, minimum: 0, maximum: 24000}
                      first_bar_at: {type: [string, "null"], format: date-time}
                      last_bar_at: {type: [string, "null"], format: date-time}
                      gaps: {type: array, maxItems: 8, items: {type: string}}
                gaps:
                  type: array
                  maxItems: 72
                  items:
                    type: object
                    additionalProperties: false
                    required: [code]
                    properties:
                      code: {type: string}
                      symbol: {type: string}
                calendar_gaps_assessed: {type: boolean, const: false}
            action_coverage:
              type: object
              additionalProperties: false
              required: [dividends, stock_splits, symbol_renames]
              properties:
                dividends: {type: string, enum: [provider_field_present, provider_field_unavailable]}
                stock_splits: {type: string, enum: [provider_field_present, provider_field_unavailable]}
                symbol_renames: {type: string, const: unsupported}
            actions:
              type: array
              maxItems: 48000
              items:
                oneOf:
                  - type: object
                    additionalProperties: false
                    required: [symbol, event_ts_utc, kind, amount, source]
                    properties:
                      symbol: {type: string}
                      event_ts_utc: {type: string, format: date-time}
                      kind: {type: string, const: DIVIDEND}
                      amount: {type: string}
                      source: {type: string, const: Yahoo Finance}
                  - type: object
                    additionalProperties: false
                    required: [symbol, event_ts_utc, kind, ratio, source]
                    properties:
                      symbol: {type: string}
                      event_ts_utc: {type: string, format: date-time}
                      kind: {type: string, const: SPLIT}
                      ratio: {type: string}
                      source: {type: string, const: Yahoo Finance}
            bars:
              type: array
              maxItems: 24000
              items:
                type: object
                additionalProperties: false
                required: [symbol, asset_class, event_ts_utc, resolution, adjustment, open, high, low, close, adj_close, volume, dividends, stock_splits]
                properties:
                  symbol: {type: string}
                  asset_class: {type: string, enum: [stock, etf]}
                  event_ts_utc: {type: string, format: date-time}
                  resolution: {type: string, const: 1d}
                  adjustment: {type: string, enum: [unadjusted, adjusted]}
                  open: {type: [string, "null"]}
                  high: {type: [string, "null"]}
                  low: {type: [string, "null"]}
                  close: {type: [string, "null"]}
                  adj_close: {type: [string, "null"]}
                  volume: {type: [string, "null"]}
                  dividends: {type: [string, "null"]}
                  stock_splits: {type: [string, "null"]}
            provenance:
              type: object
              additionalProperties: false
              required: [acquired_at, adapter_version, adjustment, cache_status, config_fingerprint, end, include_actions, interval, missing_symbols, prepost, provider, query_fingerprint, requested_at, requested_symbols, returned_symbols, row_count, schema_version, served_at, source, start]
              properties:
                acquired_at: {type: string, format: date-time}
                adapter_version: {type: string}
                adjustment: {type: string, enum: [unadjusted, adjusted]}
                cache_status: {type: string, enum: [network, fresh_cache, stale_cache]}
                config_fingerprint: {type: string, pattern: "^[0-9a-f]{64}$"}
                end: {type: string, format: date-time}
                include_actions: {type: boolean, const: true}
                interval: {type: string, const: 1d}
                missing_symbols: {type: array, items: {type: string}}
                prepost: {type: boolean, const: false}
                provider: {type: string, const: yahoo_finance}
                query_fingerprint: {type: string, pattern: "^[0-9a-f]{64}$"}
                requested_at: {type: string, format: date-time}
                requested_symbols: {type: array, items: {type: string}}
                returned_symbols: {type: array, items: {type: string}}
                row_count: {type: integer, minimum: 0, maximum: 24000}
                schema_version: {type: string, const: research-bars-v1}
                served_at: {type: string, format: date-time}
                source: {type: string, const: yfinance}
                start: {type: string, format: date-time}
    YFinanceResearchError:
      type: object
      additionalProperties: false
      required: [schema_version, status, error]
      properties:
        schema_version: {type: string, const: mdp-yfinance-research-observations-v1}
        status: {type: string, const: error}
        error:
          type: object
          additionalProperties: false
          required: [code, message, retryable]
          properties:
            code: {type: string}
            message: {type: string}
            retryable: {type: boolean}
    LocalCapturePairChunkSummaryV2:
      type: object
      additionalProperties: false
      required:
        - status
        - verification_scope
        - source_completeness
        - pair_verification
        - pair_verification_version
        - transport
        - provider
        - feed
        - entitlement
        - capture_instance_id
        - source_generation
        - canonical_generation
        - first_source_frame_sequence
        - last_source_frame_sequence
        - raw_frame_count
        - normalized_event_count
        - input_payload_bytes
        - input_chunk_sha256
        - manifest_input_sha256
        - raw_dataset_id
        - raw_manifest_sha256
        - raw_object_sha256
        - raw_schema_id
        - raw_row_count
        - event_dataset_id
        - event_manifest_sha256
        - event_object_sha256
        - event_schema_id
        - event_row_count
      properties:
        status: {type: string, const: VERIFIED_LOCAL_TEST_CHUNK_ONLY}
        verification_scope: {type: string, const: SINGLE_CHUNK_LOCAL_READBACK}
        source_completeness: {type: string, const: NOT_ASSERTED}
        pair_verification:
          type: string
          const: EXACT_RAW_EVENT_ARTIFACT_READBACK_MATCH_LOCAL_ONLY
        pair_verification_version: {type: integer, const: 1}
        transport: {type: string, const: local_test}
        provider: {type: string, enum: [alpaca, synthetic]}
        feed: {type: string, enum: [opra, synthetic]}
        entitlement: {type: string, const: unknown}
        capture_instance_id:
          type: string
          pattern: "^[0-9a-f]{12}4[0-9a-f]{3}[89ab][0-9a-f]{15}$"
        source_generation: {$ref: "#/components/schemas/WireU64"}
        canonical_generation: {$ref: "#/components/schemas/WireU64"}
        first_source_frame_sequence: {$ref: "#/components/schemas/WireU64"}
        last_source_frame_sequence: {$ref: "#/components/schemas/WireU64"}
        raw_frame_count:
          type: integer
          minimum: 1
          maximum: 1024
          description: Exact raw frame rows in this chunk; raw_row_count has the same value.
        normalized_event_count:
          type: integer
          minimum: 0
          maximum: 524288
          description: Exact normalized event rows in this chunk; event_row_count has the same value.
        input_payload_bytes:
          allOf:
            - $ref: "#/components/schemas/WireU64"
          description: Sum of the exact ordered captured raw payload byte lengths.
        input_chunk_sha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: Metadata-rich MDP chunk identity digest, distinct from the manifest payload-only input hash.
        manifest_input_sha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: Core finite-batch SHA-256 of the exact ordered raw payload byte concatenation.
        raw_dataset_id: {type: string}
        raw_manifest_sha256: {type: string, pattern: "^[0-9a-f]{64}$"}
        raw_object_sha256: {type: string, pattern: "^[0-9a-f]{64}$"}
        raw_schema_id: {type: string, enum: [lqepoch.market_raw_frame.v2, lqepoch.market_raw_json_frame.v2]}
        raw_row_count: {$ref: "#/components/schemas/WireU64"}
        event_dataset_id: {type: string}
        event_manifest_sha256: {type: string, pattern: "^[0-9a-f]{64}$"}
        event_object_sha256: {type: string, pattern: "^[0-9a-f]{64}$"}
        event_schema_id: {type: string, const: lqepoch.market_event.v3}
        event_row_count: {$ref: "#/components/schemas/WireU64"}
      allOf:
        - oneOf:
            - properties:
                provider: {const: alpaca}
                feed: {const: opra}
            - properties:
                provider: {const: synthetic}
                feed: {const: synthetic}
    RemoteQuerySummary:
      type: object
      required:
        - namespace
        - dataset_id
        - schema_id
        - source
        - row_count
        - returned_rows
        - content_sha256
        - parquet_schema_sha256
        - cache_hit
      properties:
        namespace:
          type: string
          enum: [diagnostic, curated]
        dataset_id:
          type: string
        schema_id:
          const: lqepoch.us_equity_trade_bar_1m.v1
        source:
          $ref: "#/components/schemas/MarketDataSourceV1"
        row_count:
          description: Canonical base-10 string projection of an unsigned 64-bit value.
          $ref: "#/components/schemas/WireU64"
        returned_rows:
          description: Canonical base-10 string projection of an unsigned 64-bit value.
          $ref: "#/components/schemas/WireU64"
        content_sha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
        parquet_schema_sha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
        cache_hit:
          type: boolean
    MarketDataSourceV1:
      type: object
      required: [provider, feed, entitlement, numeric_encoding]
      properties:
        provider:
          type: string
        feed:
          type: string
        entitlement:
          type: string
          enum: [unknown, authorized, unauthorized]
        numeric_encoding:
          type: string
          enum:
            - unspecified
            - decimal_token
            - integer_token
            - binary_float64_shortest_decimal
            - binary_float32_shortest_decimal
            - raw_messagepack_bytes
            - raw_json_bytes
        source_record_id:
          type: [string, "null"]
    TradeMinuteBarV1:
      type: object
      additionalProperties: false
      description: >-
        One observed trade-minute bar. The window may be sparse: minutes without a trade observation,
        including quote-only minutes, have no row. For each symbol, emitted row count equals
        window_expected_minutes minus window_empty_trade_minutes. The count describes the consumed
        finite input and does not prove provider-side market completeness or entitlement.
      required:
        - schema_version
        - source_provider
        - source_feed
        - source_entitlement
        - source_numeric_encoding
        - symbol
        - bar_start_utc
        - bar_end_exclusive_utc
        - available_at_utc
        - trade_date
        - session_id
        - session_timezone
        - session_policy_id
        - session_policy_sha256
        - session_start_utc
        - session_end_exclusive_utc
        - window_start_utc
        - window_end_exclusive_utc
        - open
        - high
        - low
        - close
        - volume
        - trade_count
        - quote_events_excluded
        - source_timestamp_missing_rows
        - sequence_gap_count
        - late_event_count
        - window_expected_minutes
        - window_empty_trade_minutes
        - source_start_utc
        - source_end_exclusive_utc
        - window_input_eof
        - source_pages_exhausted
        - completion_mode
        - nbbo_input_status
      properties:
        schema_version:
          type: integer
          const: 1
        source_provider: {type: string}
        source_feed: {type: string}
        source_entitlement: {type: string}
        source_numeric_encoding: {type: string}
        symbol: {type: string}
        bar_start_utc: {$ref: "#/components/schemas/UtcTimestamp"}
        bar_end_exclusive_utc: {$ref: "#/components/schemas/UtcTimestamp"}
        available_at_utc: {$ref: "#/components/schemas/UtcTimestamp"}
        trade_date: {type: string, format: date}
        session_id: {type: string}
        session_timezone: {type: string}
        session_policy_id: {type: string}
        session_policy_sha256: {type: string, pattern: "^[0-9a-f]{64}$"}
        session_start_utc: {$ref: "#/components/schemas/UtcTimestamp"}
        session_end_exclusive_utc: {$ref: "#/components/schemas/UtcTimestamp"}
        window_start_utc: {$ref: "#/components/schemas/UtcTimestamp"}
        window_end_exclusive_utc: {$ref: "#/components/schemas/UtcTimestamp"}
        open: {$ref: "#/components/schemas/ExactDecimalString"}
        high: {$ref: "#/components/schemas/ExactDecimalString"}
        low: {$ref: "#/components/schemas/ExactDecimalString"}
        close: {$ref: "#/components/schemas/ExactDecimalString"}
        volume: {$ref: "#/components/schemas/ExactDecimalString"}
        trade_count: {$ref: "#/components/schemas/WireU64"}
        quote_events_excluded: {$ref: "#/components/schemas/WireU64"}
        source_timestamp_missing_rows: {$ref: "#/components/schemas/WireU64"}
        sequence_gap_count: {$ref: "#/components/schemas/WireU64"}
        late_event_count: {$ref: "#/components/schemas/WireU64"}
        window_expected_minutes: {$ref: "#/components/schemas/WireU64"}
        window_empty_trade_minutes: {$ref: "#/components/schemas/WireU64"}
        source_start_utc: {$ref: "#/components/schemas/UtcTimestamp"}
        source_end_exclusive_utc: {$ref: "#/components/schemas/UtcTimestamp"}
        window_input_eof: {type: boolean}
        source_pages_exhausted:
          type: [boolean, "null"]
        completion_mode: {type: string}
        nbbo_input_status: {type: string}
    UtcTimestamp:
      type: string
      format: date-time
      pattern: "Z$"
    ExactDecimalString:
      type: string
      pattern: "^-?(0|[1-9][0-9]*)(\\.[0-9]+)?$"
    WireU64:
      type: string
      pattern: "^(0|[1-9][0-9]*)$"
    NullableWireU64:
      oneOf:
        - {$ref: "#/components/schemas/WireU64"}
        - type: "null"
