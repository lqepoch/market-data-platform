[graph]
all-features = true
# An empty target list checks the graph across all target-specific dependencies.

[advisories]
version = 2
yanked = "deny"
unmaintained = "all"
unsound = "all"
maximum-db-staleness = "P7D"
ignore = []

[bans]
multiple-versions = "deny"
multiple-versions-include-dev = true
wildcards = "deny"
allow-wildcard-paths = true
workspace-default-features = "allow"
external-default-features = "allow"
deny = []

[[bans.skip]]
name = "getrandom"
version = "=0.2.17"
reason = "Pinned transitive consumers require distinct 0.2, 0.3, and 0.4 APIs; this exact duplicate is reviewed and new versions remain denied."

[[bans.skip]]
name = "getrandom"
version = "=0.3.4"
reason = "Pinned transitive consumers require distinct 0.2, 0.3, and 0.4 APIs; this exact duplicate is reviewed and new versions remain denied."

[[bans.skip]]
name = "r-efi"
version = "=5.3.0"
reason = "This target-specific UEFI support version follows getrandom 0.3.4; the exact duplicate is reviewed and new versions remain denied."

[[bans.skip]]
name = "syn"
version = "=2.0.119"
reason = "Pinned procedural macro dependencies currently require both syn 2 and syn 3; this exact duplicate is reviewed and new versions remain denied."

[licenses]
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CC0-1.0",
  "MIT",
  "Unicode-3.0",
  "Unlicense",
]
confidence-threshold = 0.95
include-dev = true
include-build = true
unused-allowed-license = "warn"
exceptions = []

[licenses.private]
ignore = false

[sources]
unknown-registry = "deny"
unknown-git = "deny"
required-git-spec = "rev"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/lqepoch/trading-core"]
unused-allowed-source = "deny"
